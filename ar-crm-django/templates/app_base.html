{% extends "base.html" %}
{% block body %}
<header class="border-b border-gray-200 bg-white">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
    <div class="flex items-center gap-8">
      <span class="text-sm font-bold tracking-wide text-emerald-900">ARCHITECTURE CRM</span>
      <nav class="flex gap-5 text-sm font-medium">
        <a href="{% url 'dashboard' %}"
           class="{% if request.path == '/' %}text-emerald-800 underline underline-offset-8{% else %}text-gray-600 hover:text-gray-900{% endif %}">Dashboard</a>
        <a href="{% url 'client_list' %}"
           class="{% if '/clients/' in request.path %}text-emerald-800 underline underline-offset-8{% else %}text-gray-600 hover:text-gray-900{% endif %}">Clients</a>
      </nav>
    </div>
    <div class="flex items-center gap-4">
      <span class="hidden text-sm text-gray-500 sm:inline">{{ request.user.email }}</span>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="rounded border border-gray-300 px-4 py-2 text-sm font-semibold hover:bg-gray-100">Log out</button>
      </form>
    </div>
  </div>
</header>

<main class="mx-auto max-w-6xl px-6 py-10">
  {% if messages %}
    <div class="mb-6 space-y-2">
      {% for message in messages %}
        <p class="rounded border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-900" role="status">{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
</main>
{% endblock %}
