{% extends "app_base.html" %}
{% block title %}Delete client · Architecture CRM{% endblock %}
{% block content %}
<div class="max-w-xl">
  <h1 class="text-3xl font-semibold tracking-tight">Delete client</h1>
  <p class="mt-4 text-sm text-gray-700">Are you sure you want to delete <strong>{{ client.name }}</strong>? This cannot be undone.</p>
  <form method="post" class="mt-8 flex items-center gap-4">
    {% csrf_token %}
    <button type="submit" class="rounded bg-red-700 px-5 py-2.5 text-sm font-semibold text-white hover:bg-red-800">Yes, delete</button>
    <a href="{% url 'client_list' %}" class="text-sm text-gray-600 underline">Cancel</a>
  </form>
</div>
{% endblock %}
