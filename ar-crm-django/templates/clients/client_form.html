{% extends "app_base.html" %}
{% block title %}{{ title }} · archdo.{% endblock %}
{% block content %}
<div class="max-w-xl">
  <h1 class="text-3xl font-semibold tracking-tight">{{ title }}</h1>
  <form method="post" class="mt-8 space-y-5">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label for="{{ field.id_for_label }}" class="block text-sm font-medium">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}
          <p class="mt-1 text-sm text-red-700" role="alert">{{ error }}</p>
        {% endfor %}
      </div>
    {% endfor %}
    <div class="flex items-center gap-4 pt-2">
      <button type="submit" class="rounded bg-emerald-800 px-5 py-2.5 text-sm font-semibold text-white hover:bg-emerald-900">Save</button>
      <a href="{% url 'client_list' %}" class="text-sm text-gray-600 underline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
